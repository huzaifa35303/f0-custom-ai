<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>f0undr Ai</title>
    <meta
      name="description"
      content="Answers from a knowledge base you teach it, and from live web search."
    />
    <!-- Installable as an app on a phone or desktop. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#10a37f" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="f0undr Ai" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Inter for the interface, JetBrains Mono for code. The stack falls back
         to the system UI font, so the app still looks right offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="brand-group">
        <a href="https://f0undr.vercel.app/" target="_blank" rel="noreferrer" style="text-decoration:none; color:inherit;" title="Return to f0undr Atelier">
          <h1>f0undr Ai</h1>
        </a>
        <div class="model-badge" title="Active Model">
          <span class="model-active">genni 1</span>
          <span class="model-tag">Active</span>
        </div>
      </div>
      <div class="header-right">
        <div class="model-selector-pill" title="Upcoming Models">
          <span class="coming-soon-label">Coming soon:</span>
          <span class="model-upcoming">genni 2</span>
          <span class="model-dot">•</span>
          <span class="model-upcoming">genni 3</span>
        </div>
        <span id="status" class="status">checking…</span>
        <button id="reset" type="button">New chat</button>
      </div>
    </header>

    <main id="thread" aria-live="polite">
      <div class="welcome">
        <h2>Ask f0undr Ai anything</h2>
        <div class="welcome-model-pill">
          <span class="badge-active">Model: <strong>genni 1</strong></span>
          <span class="badge-soon">genni 2 &amp; genni 3 coming soon</span>
        </div>
        <p>Every answer is powered by genni 1 with live search and taught memory, written out in plain language.</p>
      </div>
    </main>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="Send a message…" autocomplete="off" autofocus></textarea>
      <button id="send" type="submit" aria-label="Send">↑</button>
    </form>

    <script type="module" src="/app.js"></script>
  </body>
</html>
