<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>f0undr Ai</title>
    <meta
      name="description"
      content="Answers from a knowledge base you teach it, and from live web search."
    />
    <!-- Installable as an app on a phone or desktop. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#10a37f" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="f0undr Ai" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Inter for the interface, JetBrains Mono for code. The stack falls back
         to the system UI font, so the app still looks right offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-layout">
      <!-- Mobile sidebar backdrop -->
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

      <!-- Left Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <button id="sidebar-new-btn" class="sidebar-new-btn" type="button" title="Start a new conversation">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>New chat</span>
          </button>
          <button id="sidebar-close-btn" class="sidebar-icon-btn" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
          </button>
        </div>

        <div class="sidebar-scroll">
          <div id="chat-list" class="chat-list">
            <!-- Dynamic date groups and chat items -->
          </div>
        </div>

        <div class="sidebar-footer">
          <div class="user-pill">
            <span class="user-avatar">f0</span>
            <div class="user-details">
              <span class="user-name">f0undr Ai</span>
              <span class="user-sub">genni 1 active</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Chat Area -->
      <div class="chat-main">
        <header>
          <div class="brand-group">
            <button id="sidebar-toggle-btn" class="sidebar-icon-btn toggle-btn" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <line x1="9" y1="3" x2="9" y2="21"/>
              </svg>
            </button>
            <a href="https://f0undr.vercel.app/" target="_blank" rel="noreferrer" style="text-decoration:none; color:inherit;" title="Return to f0undr Atelier">
              <h1>f0undr Ai</h1>
            </a>
          </div>
          <div class="header-right">
            <span id="status" class="status">checking…</span>
            <button id="reset" type="button">New chat</button>
          </div>
        </header>

        <main id="thread" aria-live="polite">
          <div class="welcome">
            <h2>Ask f0undr Ai anything</h2>
            <div class="welcome-model-pill">
              <span class="badge-active">Model: <strong>genni 1</strong></span>
              <span class="badge-soon">genni 2 &amp; genni 3 coming soon</span>
            </div>
            <p>Every answer is powered by genni 1 with live search and taught memory, written out in plain language.</p>
          </div>
        </main>

        <div class="composer-wrap">
          <div class="composer-model-bar">
            <div class="model-badge-active" title="Active Model: genni 1">
              <span class="model-sparkle">✦</span>
              <span class="model-name">genni 1</span>
              <span class="model-status">Active</span>
            </div>
            <div class="model-badge-soon" title="Upcoming model updates">
              <span class="model-soon-label">Coming soon:</span>
              <span class="model-soon-name">genni 2</span>
              <span class="model-soon-dot">•</span>
              <span class="model-soon-name">genni 3</span>
            </div>
          </div>
          <form id="composer">
            <textarea id="input" rows="1" placeholder="Send a message…" autocomplete="off" autofocus></textarea>
            <button id="send" type="submit" aria-label="Send">↑</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Floating Context Menu (Exact match to screenshot) -->
    <div id="context-menu" class="context-menu hidden" role="menu">
      <button class="ctx-item" data-action="pin" role="menuitem">
        <span class="ctx-left">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 17v5M5 17h14l-2-7V4h1V2H6v2h1v6l-2 7z"/>
          </svg>
          <span class="ctx-label" id="ctx-pin-label">Pin</span>
        </span>
        <kbd>P</kbd>
      </button>
      <button class="ctx-item" data-action="unread" role="menuitem">
        <span class="ctx-left">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <span class="ctx-label" id="ctx-unread-label">Mark as unread</span>
        </span>
        <kbd>U</kbd>
      </button>
      <button class="ctx-item" data-action="rename" role="menuitem">
        <span class="ctx-left">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
          </svg>
          <span class="ctx-label">Rename</span>
        </span>
        <kbd>R</kbd>
      </button>
      <button class="ctx-item" data-action="project" role="menuitem">
        <span class="ctx-left">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <span class="ctx-label">Add to project</span>
        </span>
        <span class="ctx-arrow">&gt;</span>
      </button>
      <button class="ctx-item" data-action="group" role="menuitem">
        <span class="ctx-left">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="ctx-label">Move to group</span>
        </span>
        <span class="ctx-arrow">&gt;</span>
      </button>
      <div class="ctx-separator"></div>
      <button class="ctx-item danger" data-action="delete" role="menuitem">
        <span class="ctx-left">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          <span class="ctx-label">Delete</span>
        </span>
        <kbd>D</kbd>
      </button>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
